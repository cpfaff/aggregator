# GFBio Search and Harvesting Infrastructure - Development Configuration

# Environment variables used across services:
# - DB_USER, DB_PASSWORD, DB_NAME: Database connection credentials
# - ENVIRONMENT: Application environment (development, production)
# - REDIS_BROKER_DB, REDIS_RESULT_DB: Redis database numbers for Celery
# - BACKEND_TRAEFIK_ENABLED, FRONTEND_TRAEFIK_ENABLED: Flags to enable/disable Traefik routing for services

services:
  traefik:
    image: traefik:v2.10
    ports:
      - "80:80"      # Main HTTP port
      # - "443:443"    # HTTPS port for local development
      - "8080:8080"  # Dashboard for development
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./traefik/acme.json:/acme.json
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dbname}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-dbname}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./validator:/validator
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0} 
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=${BACKEND_TRAEFIK_ENABLED:-true}"
      # Simplified API router
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # No middleware needed as we're not stripping prefixes anymore
    command: >
      bash -c "
        cd /app && 
        pip install -e /validator &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Legacy single worker - commented out in favor of dual-worker configuration
  # celery-worker:
  #   build:
  #     context: ./backend
  #   volumes:
  #     - ./backend:/app
  #     - ./validator:/validator
  #   depends_on:
  #     - db
  #     - redis
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
  #     - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
  #     - ENVIRONMENT=${ENVIRONMENT:-development}
  #     - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
  #     - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping"]
  #     interval: 30s
  #     timeout: 60s
  #     retries: 3
  #     start_period: 10s
  #   command: >
  #     bash -c "
  #       cd /app && 
  #       pip install -e /validator &&
  #       celery -A app.core.celery_app worker --concurrency=1 --pool=solo --loglevel=info
  #     "

  # Validation worker - handles heavy validation tasks
  celery_worker_validation:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./validator:/validator
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 10s
    command: >
      bash -c "
        cd /app && 
        pip install -e /validator &&
        celery -A app.core.celery_app worker --queues=heavy_validation --concurrency=1 --pool=solo --loglevel=info
      "

  # Statistics worker - handles light tasks and statistics collection
  celery_worker_stats:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./validator:/validator
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 10s
    command: >
      bash -c "
        cd /app && 
        pip install -e /validator &&
        python -c 'from app.core.resource_allocation import get_validator_cpu_count, get_stats_worker_concurrency; from app.core.config import settings; validator_cpus = get_validator_cpu_count(settings.VALIDATOR_CPU_PERCENT); stats_concurrency = get_stats_worker_concurrency(settings.STATS_WORKER_CONCURRENCY, validator_cpus); print(f\"Starting stats worker with {stats_concurrency} workers\"); import subprocess; subprocess.run([\"celery\", \"-A\", \"app.core.celery_app\", \"worker\", \"--queues=light_tasks\", f\"--concurrency={stats_concurrency}\", \"--pool=prefork\", \"--loglevel=info\"])'
      "

  celery-beat:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - ./validator:/validator
    depends_on:
      - redis
      - celery_worker_validation
      - celery_worker_stats
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 10s
    command: >
      bash -c "
        cd /app && 
        pip install -e /validator &&
        celery -A app.core.celery_app beat --loglevel=info
      "
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=${FRONTEND_TRAEFIK_ENABLED:-true}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"

  # Add maintenance service to development setup (disabled by default)
  maintenance:
    image: nginx:alpine
    networks:
      - app-network
    volumes:
      - ./maintenance:/usr/share/nginx/html
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=${MAINTENANCE_TRAEFIK_ENABLED:-false}"  # Disabled by default
      - "traefik.http.routers.maintenance.rule=PathPrefix(`/`)"
      - "traefik.http.routers.maintenance.entrypoints=web"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
      - "traefik.http.routers.maintenance.priority=100"  # Higher priority to override other routes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
