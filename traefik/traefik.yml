# Global Traefik configuration
entryPoints:
  web:
    address: ":80"
  # websecure:
  #   address: ":443"

# Enable Docker provider for automatic service discovery
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: app-network

# Enable API and dashboard (access at http://localhost:8080/dashboard/)
api:
  dashboard: false 
  # insecure: true  # In production, secure this with authentication

# Enable ping for health checks
ping:
  entryPoint: "web"

# Configure Let's Encrypt for production
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: "your-email@example.com"  # Change this to your email
#       storage: /etc/traefik/acme.json
#       httpChallenge:
#         entryPoint: web

# Log configuration
log:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR, FATAL

# Access logs
accessLog: {}
