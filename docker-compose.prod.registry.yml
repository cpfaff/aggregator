services:
  traefik:
    image: traefik:v3.3
    ports:
      - "80:80"
      # - "443:443"  # Commented out as TLS termination is handled by jump host edge router
      # - "8080:8080"  # Dashboard not needed in production
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      # - ./traefik/acme.json:/acme.json  # Not needed when TLS termination is handled externally
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dbname}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-dbname}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    image: ${DOCKER_REGISTRY:-docker.gitlab-pe.gwdg.de/gfbio/aggregator}/backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=${BACKEND_TRAEFIK_ENABLED:-true}"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # Validation worker - handles heavy validation tasks
  celery_worker_validation:
    image: ${DOCKER_REGISTRY:-docker.gitlab-pe.gwdg.de/gfbio/aggregator}/backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 10s
    command: >
      celery -A app.core.celery_app worker --queues=heavy_validation --concurrency=1 --pool=solo --loglevel=info

  # Statistics worker - handles light tasks and statistics collection
  celery_worker_stats:
    image: ${DOCKER_REGISTRY:-docker.gitlab-pe.gwdg.de/gfbio/aggregator}/backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 10s
    command: >
      python -c 'from app.core.resource_allocation import get_validator_cpu_count, get_stats_worker_concurrency; from app.core.config import settings; validator_cpus = get_validator_cpu_count(settings.VALIDATOR_CPU_PERCENT); stats_concurrency = get_stats_worker_concurrency(settings.STATS_WORKER_CONCURRENCY, validator_cpus); print(f"Starting stats worker with {stats_concurrency} workers"); import subprocess; subprocess.run(["celery", "-A", "app.core.celery_app", "worker", "--queues=light_tasks", f"--concurrency={stats_concurrency}", "--pool=prefork", "--loglevel=info"])'

  celery-beat:
    image: ${DOCKER_REGISTRY:-docker.gitlab-pe.gwdg.de/gfbio/aggregator}/backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - redis
      - celery_worker_validation
      - celery_worker_stats
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - SYNC_DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-dbname}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CELERY_BROKER_URL=redis://redis:6379/${REDIS_BROKER_DB:-0}
      - CELERY_RESULT_BACKEND=redis://redis:6379/${REDIS_RESULT_DB:-0}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: >
      celery -A app.core.celery_app beat --loglevel=info

  frontend:
    image: ${DOCKER_REGISTRY:-docker.gitlab-pe.gwdg.de/gfbio/aggregator}/frontend:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - app-network
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=${FRONTEND_TRAEFIK_ENABLED:-true}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.priority=1"

  maintenance:
    image: nginx:alpine
    restart: always
    networks:
      - app-network
    volumes:
      - ./maintenance:/usr/share/nginx/html
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "traefik.enable=${MAINTENANCE_TRAEFIK_ENABLED:-false}"
      - "traefik.http.routers.maintenance.rule=PathPrefix(`/`)"
      - "traefik.http.routers.maintenance.entrypoints=web"
      - "traefik.http.services.maintenance.loadbalancer.server.port=80"
      - "traefik.http.routers.maintenance.priority=100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
