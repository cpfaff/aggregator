[project]
name = "aggregator"
version = "0.1.0"
description = ""
authors = [
    {name = "ctpfaff",email = "Claas-Thido.Pfaff@gfbio.org"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.109.0)",
    "uvicorn[standard] (>=0.27.0)",
    "pyjwt (>=2.8.0)",
    "python-multipart (>=0.0.7)",
    "email-validator (>=2.1.0)",
    "sqlalchemy (>=2.0.25)",
    "asyncpg (>=0.29.0)",
    "alembic (>=1.13.1)",
    "psycopg2-binary (>=2.9.9)",
    "bcrypt (>=4.1.2)",
    "pydantic-settings (>=2.8.0)",
    "python-json-logger (>=3.2.1)",
    "fastapi-csrf-protect (>=1.0.2)",
    "slowapi (>=0.1.9)",
    "celery (>=5.3.6)",
    "redis (>=5.0.1)",
    "flower (>=2.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "testcontainers (>=4.14.1,<5.0.0)",
    "coverage (>=7.13.3,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # Line too long (formatter handles)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
