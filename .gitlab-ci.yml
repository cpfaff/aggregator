---
include:
  - project: gfbio/cicd
    file:
      - '.create_merge_request_v3.yml'
      - '.tag_release.yml'

image: docker:latest

services:
  - name: docker:dind
    alias: docker

stages:
  - create_merge_request
  - tag_release_check
  - tag_release
  - build
  - deploy

variables:
  # DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: docker.gitlab-pe.gwdg.de/gfbio/aggregator
  DOCKER_BUILDKIT: 1
  PROJECT_NAME: "gfbio-aggregator"
  MAIN_BRANCH_NAME: "master"

# Cache during the pipeline
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

create_merge_request:
  variables:
    PROJECT_NAME: ${PROJECT_NAME}
    APPROVERS: "3832" # Update this with your approver IDs if needed
  tags:
    - dev-denbi

tag_release_check:
  variables:
    MAIN_BRANCH_NAME: ${MAIN_BRANCH_NAME}
  tags:
    - dev-denbi

# Build Backend
build-backend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building backend image..."
    - docker build -t $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/backend:latest -f backend/Dockerfile.prod ./backend
    - docker push $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/backend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Build Frontend
build-frontend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building frontend image..."
    - docker build -t $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/frontend:latest -f frontend/Dockerfile.prod ./frontend
    - docker push $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/frontend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Deploy to production
deploy-production:
  stage: deploy
  image: docker/compose:latest
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_REGISTRY: $DOCKER_REGISTRY
    ENVIRONMENT: production
    MAINTENANCE_MODE: ${MAINTENANCE_MODE:-"false"}
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Deploying to production..."
    # Create environment files from CI variables
    
    # Create global .env file
    - echo "# Global environment variables for Docker Compose" > ./.env
    - echo "DB_USER=${DB_USER:-user}" >> ./.env
    - echo "DB_PASSWORD=${DB_PASSWORD:-password}" >> ./.env
    - echo "DB_NAME=${DB_NAME:-dbname}" >> ./.env
    - echo "ENVIRONMENT=${ENVIRONMENT:-production}" >> ./.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./.env
    
    # Create backend .env file
    - mkdir -p ./backend
    - echo "# Backend-specific environment variables" > ./backend/.env
    - echo "SECRET_KEY=${SECRET_KEY:-defaultsecretkey}" >> ./backend/.env
    - echo "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}" >> ./backend/.env
    - echo "LOG_LEVEL=${LOG_LEVEL:-INFO}" >> ./backend/.env
    - echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://aggregator.gfbio.org}" >> ./backend/.env
    
    # Create frontend .env file
    - mkdir -p ./frontend
    - echo "# Frontend-specific environment variables" > ./frontend/.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./frontend/.env
    
    # Create maintenance directory if it doesn't exist
    - mkdir -p ./maintenance
    
    # Set environment variables for maintenance mode
    
    # Deploy with docker-compose
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - export DOCKER_REGISTRY=docker.gitlab-pe.gwdg.de/gfbio/aggregator
    - docker-compose -f docker-compose.prod.registry.yml config
    - docker-compose -f docker-compose.prod.registry.yml pull
    
    # Step 1: Enable maintenance mode and start only the maintenance container
    - echo "Enabling maintenance container..."
    - export BACKEND_TRAEFIK_ENABLED=false
    - export FRONTEND_TRAEFIK_ENABLED=false
    - export MAINTENANCE_TRAEFIK_ENABLED=true
    - docker-compose -f docker-compose.prod.registry.yml up -d maintenance --force-recreate
    
    # Step 2: Wait a bit for the maintenance container to be properly registered with Traefik
    - sleep 5
    
    # Step 3: Stop all services except traefik and maintenance
    - echo "Restarting application services..."
    - docker-compose -f docker-compose.prod.registry.yml stop backend frontend celery-worker celery-beat
    
    # Step 4: Start all services except maintenance with their latest images
    - docker-compose -f docker-compose.prod.registry.yml up -d db redis backend frontend celery-worker celery-beat
    
    # Step 5: Wait for backend to become healthy
    - |
      echo "Waiting for services to be healthy..."
      # Set maximum wait time (5 minutes to avoid GitLab CI timeouts)
      MAX_WAIT=300
      WAITED=0
      SLEEP_TIME=10
      
      # Function to check health status
      check_health() {
        echo "--- Current service statuses ---"
        docker-compose -f docker-compose.prod.registry.yml ps
        
        # List any containers that are not yet healthy for debugging
        echo "--- Containers not yet marked healthy ---"
        UNHEALTHY_LIST=$(docker-compose -f docker-compose.prod.registry.yml ps | grep -v "maintenance" | grep -v "(healthy)" | grep -v "^NAME" | grep -v "Exit 0")
        echo "$UNHEALTHY_LIST"
        
        # Count unhealthy services
        UNHEALTHY_COUNT=$(echo "$UNHEALTHY_LIST" | wc -l)
        if [ -z "$UNHEALTHY_LIST" ]; then
          UNHEALTHY_COUNT=0
        fi
        echo "Number of unhealthy services detected: $UNHEALTHY_COUNT"
        
        return $UNHEALTHY_COUNT
      }
      
      # Function to ensure maintenance mode on failure
      ensure_maintenance() {
        echo "Ensuring maintenance mode is active on failure..."
        export BACKEND_TRAEFIK_ENABLED=false
        export FRONTEND_TRAEFIK_ENABLED=false
        export MAINTENANCE_TRAEFIK_ENABLED=true
        docker-compose -f docker-compose.prod.registry.yml up -d maintenance --force-recreate
      }
      
      # Main wait loop
      while [ $WAITED -lt $MAX_WAIT ]; do
        echo "Waiting for services to become healthy... ($WAITED/$MAX_WAIT seconds)"
        
        # Check health status
        check_health
        UNHEALTHY=$?
        
        if [ $UNHEALTHY -eq 0 ]; then
          echo "All services are healthy. Disabling maintenance mode and restoring normal service..."
          export BACKEND_TRAEFIK_ENABLED=true
          export FRONTEND_TRAEFIK_ENABLED=true
          export MAINTENANCE_TRAEFIK_ENABLED=false
          docker-compose -f docker-compose.prod.registry.yml up -d db redis backend frontend celery-worker celery-beat
          
          echo "Waiting for services to stabilize after restoration..."
          MAX_WAIT=600
          WAITED=0
          SLEEP_TIME=10

          while [ $WAITED -lt $MAX_WAIT ]; do
            echo "Checking if services remain healthy after restoration... ($WAITED/$MAX_WAIT seconds)"
            
            # Check health status again
            check_health
            UNHEALTHY=$?
            
            if [ $UNHEALTHY -eq 0 ]; then
              echo "All services remain healthy. Putting maintenance back to handle ongoing traffic..."
              docker-compose -f docker-compose.prod.registry.yml up -d maintenance --force-recreate
              echo "Deployment completed successfully."
              exit 0
            fi
            
            # Sleep and increment counter
            sleep $SLEEP_TIME
            WAITED=$((WAITED + SLEEP_TIME))
          done
          
          echo "Timed out waiting for services to stabilize. Ensuring maintenance mode and collecting diagnostic information..."
          ensure_maintenance
          
          # Show logs of unhealthy services for debugging
          echo "Logs from services that failed to stabilize:"
          docker-compose -f docker-compose.prod.registry.yml logs --tail=50 backend frontend celery-worker celery-beat
        fi
        
        # Sleep and increment counter
        echo "Waiting a bit for the next round.... "
        echo $SLEEP_TIME
      
        sleep $SLEEP_TIME

        WAITED=$((WAITED + SLEEP_TIME))
      done
      
      echo "Timed out waiting for services to become healthy. Ensuring maintenance mode and collecting diagnostic information..."
      ensure_maintenance
      
      # Show logs of unhealthy services for debugging
      echo "Logs from services that failed to become healthy:"
      docker-compose -f docker-compose.prod.registry.yml logs --tail=50 backend frontend celery-worker celery-beat
    
  environment:
    name: production
    url: https://aggregator.gfbio.org  # Update with your actual production URL
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  tags:
    - deploy-aggregator
  timeout: 15m
