---
include:
  - project: gfbio/cicd
    file:
      - '.create_merge_request_v3.yml'
      - '.tag_release.yml'

image: docker:latest

services:
  - name: docker:dind
    alias: docker

stages:
  - create_merge_request
  - tag_release_check
  - tag_release
  - build
  - deploy

variables:
  # DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: docker.gitlab-pe.gwdg.de/gfbio/aggregator
  DOCKER_BUILDKIT: 1
  PROJECT_NAME: "gfbio-aggregator"
  MAIN_BRANCH_NAME: "master"

# Cache during the pipeline
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

create_merge_request:
  variables:
    PROJECT_NAME: ${PROJECT_NAME}
    APPROVERS: "3832" # Update this with your approver IDs if needed
  tags:
    - dev-denbi

tag_release_check:
  variables:
    MAIN_BRANCH_NAME: ${MAIN_BRANCH_NAME}
  tags:
    - dev-denbi

# Build Backend
build-backend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building backend image..."
    - docker build -t $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/backend:latest -f backend/Dockerfile.prod ./backend
    - docker push $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/backend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Build Frontend
build-frontend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building frontend image..."
    - docker build -t $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/frontend:latest -f frontend/Dockerfile.prod ./frontend
    - docker push $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/frontend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Deploy to production
deploy-production:
  stage: deploy
  image: docker/compose:latest
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_REGISTRY: $DOCKER_REGISTRY
    ENVIRONMENT: production
    MAINTENANCE_MODE: ${MAINTENANCE_MODE:-"false"}
    TIMESTAMP_FORMAT: '%Y-%m-%d %H:%M:%S'
  before_script:
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Starting production deployment job for commit $CI_COMMIT_SHORT_SHA"
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Environment: $ENVIRONMENT, Maintenance mode: $MAINTENANCE_MODE"
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Authenticating with Docker registry"
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Authentication successful"
  script:
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Deploying to production environment"
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Setting up environment files"
    
    # Create global .env file
    - echo "# Global environment variables for Docker Compose" > ./.env
    - echo "DB_USER=${DB_USER:-user}" >> ./.env
    - echo "DB_PASSWORD=${DB_PASSWORD:-password}" >> ./.env
    - echo "DB_NAME=${DB_NAME:-dbname}" >> ./.env
    - echo "ENVIRONMENT=${ENVIRONMENT:-production}" >> ./.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./.env
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Global .env file created"
    
    # Create backend .env file
    - mkdir -p ./backend
    - echo "# Backend-specific environment variables" > ./backend/.env
    - echo "SECRET_KEY=${SECRET_KEY:-defaultsecretkey}" >> ./backend/.env
    - echo "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}" >> ./backend/.env
    - echo "LOG_LEVEL=${LOG_LEVEL:-INFO}" >> ./backend/.env
    - echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://aggregator.gfbio.org}" >> ./backend/.env
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Backend .env file created"
    
    # Create frontend .env file
    - mkdir -p ./frontend
    - echo "# Frontend-specific environment variables" > ./frontend/.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./frontend/.env
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Frontend .env file created"
    
    # Create maintenance directory if it doesn't exist
    - mkdir -p ./maintenance
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Maintenance directory created"
    
    # Deploy with docker-compose
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - export DOCKER_REGISTRY=docker.gitlab-pe.gwdg.de/gfbio/aggregator
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Using image tag: $IMAGE_TAG"
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Using docker registry: $DOCKER_REGISTRY"
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Validating docker-compose configuration"
      docker-compose -f docker-compose.prod.registry.yml config
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Pulling latest container images"
      docker-compose -f docker-compose.prod.registry.yml pull
    - echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Images pulled successfully"
    
    # Step 1: Enable maintenance mode
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Step 1: Enabling maintenance mode"
      export BACKEND_TRAEFIK_ENABLED=false
      export FRONTEND_TRAEFIK_ENABLED=false
      export MAINTENANCE_TRAEFIK_ENABLED=true
      docker-compose -f docker-compose.prod.registry.yml up -d maintenance
    - |
      # Verify maintenance container is running
      MAINT_STATUS=$(docker-compose -f docker-compose.prod.registry.yml ps maintenance | grep "Up" | wc -l)
      if [ "$MAINT_STATUS" -eq "0" ]; then
        echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Failed to start maintenance container"
        docker-compose -f docker-compose.prod.registry.yml logs maintenance
        exit 1
      else
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Maintenance mode enabled successfully"
      fi
    
    # Step 2: Start the database and redis services
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Step 2: Starting database and redis services"
      docker-compose -f docker-compose.prod.registry.yml up -d db redis
      
      # Check if db and redis started correctly
      SERVICES_STATUS=$(docker-compose -f docker-compose.prod.registry.yml ps db redis | grep "Up" | wc -l)
      if [ "$SERVICES_STATUS" -lt "2" ]; then
        echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Failed to start db or redis services"
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Service status:"
        docker-compose -f docker-compose.prod.registry.yml ps db redis
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] DB logs:"
        docker-compose -f docker-compose.prod.registry.yml logs db
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Redis logs:"
        docker-compose -f docker-compose.prod.registry.yml logs redis
        exit 1
      else
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] DB and Redis services started successfully"
      fi
    
    # Step 3: Start traefik
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Step 3: Starting traefik service"
      docker-compose -f docker-compose.prod.registry.yml up -d traefik
      
      # Check if traefik started correctly
      TRAEFIK_STATUS=$(docker-compose -f docker-compose.prod.registry.yml ps traefik | grep "Up" | wc -l)
      if [ "$TRAEFIK_STATUS" -eq "0" ]; then
        echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Failed to start traefik service"
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Traefik logs:"
        docker-compose -f docker-compose.prod.registry.yml logs traefik
        exit 1
      else
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Traefik service started successfully"
      fi
    
    # Step 4: Start all services except maintenance with their latest images
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Step 4: Starting backend services and frontend"
      docker-compose -f docker-compose.prod.registry.yml up -d db redis backend frontend celery-worker celery-beat
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] All services started, waiting for them to become healthy"
    
    # Step 5: Wait for backend to become healthy
    - |
      echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Step 5: Monitoring service health"
      # Set maximum wait time (5 minutes to avoid GitLab CI timeouts)
      MAX_WAIT=300
      WAITED=0
      SLEEP_TIME=10
      CONTINUE_WAITING=true
      
      # Function to check health status
      check_health() {
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] --- Current service statuses ---"
        docker-compose -f docker-compose.prod.registry.yml ps
        
        # List any containers that are not yet healthy for debugging
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] --- Containers not yet marked healthy ---"
        UNHEALTHY_LIST=$(docker-compose -f docker-compose.prod.registry.yml ps | grep -v "maintenance" | grep -v "(healthy)" | grep -v "^NAME" | grep -v "Exit 0")
        echo "$UNHEALTHY_LIST"
        
        # Print specific health check failures for each unhealthy service
        if [ "$UNHEALTHY_COUNT" -gt 0 ]; then
          echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Health check details ---"
          for service in backend frontend celery-worker celery-beat; do
            if echo "$UNHEALTHY_LIST" | grep -q "$service"; then
              echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Checking $service health check logs:"
              # Use built-in tools (no jq) to check health status
              docker inspect $(docker-compose -f docker-compose.prod.registry.yml ps -q $service) --format "{{.State.Health.Status}}" 2>/dev/null || echo "No health status available"
              
              # Get the most recent health check result
              echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Recent health check results for $service:"
              docker inspect $(docker-compose -f docker-compose.prod.registry.yml ps -q $service) --format "{{if .State.Health}}{{range .State.Health.Log}}Exit Code: {{.ExitCode}}, Output: {{.Output}}{{end}}{{end}}" 2>/dev/null || echo "No health check logs available"
              
              # Show relevant logs that might explain health check issues
              echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] Recent logs for $service:"
              docker-compose -f docker-compose.prod.registry.yml logs --tail=15 $service | grep -i "health\|error\|fail\|exception\|denied\|refused\|couldn't\|unable\|warn" || echo "No health-related log entries found"
            fi
          done
        fi
        
        return $UNHEALTHY_COUNT
      }
      
      # Function to ensure maintenance mode on failure
      ensure_maintenance() {
        echo "$(date +"$TIMESTAMP_FORMAT") [WARN] Ensuring maintenance mode is active on failure..."
        export BACKEND_TRAEFIK_ENABLED=false
        export FRONTEND_TRAEFIK_ENABLED=false
        export MAINTENANCE_TRAEFIK_ENABLED=true
        docker-compose -f docker-compose.prod.registry.yml up -d maintenance --force-recreate
        
        # Verify maintenance is running
        MAINT_STATUS=$(docker-compose -f docker-compose.prod.registry.yml ps maintenance | grep "Up" | wc -l)
        if [ "$MAINT_STATUS" -eq "0" ]; then
          echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Failed to enable maintenance mode"
        else
          echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Maintenance mode successfully enabled"
        fi
      }
      
      # Function to collect detailed diagnostics on failure
      collect_diagnostics() {
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] --- Collecting detailed diagnostics ---"
        
        # Check network connectivity between containers
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Network diagnostics ---"
        docker network inspect $(docker-compose -f docker-compose.prod.registry.yml network ls -q)
        
        # Check disk space
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Disk space ---"
        df -h
        
        # Check memory usage
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Memory usage ---"
        free -h
        
        # Check for any docker warnings/errors
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Docker events (last 5 minutes) ---"
        docker events --since='5m' --until='0m' || echo "No events found"
        
        # Report docker info
        echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Docker info ---"
        docker info
      }
      
      # Main wait loop
      while [ $WAITED -lt $MAX_WAIT ]; do
        echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Waiting for services to become healthy... ($WAITED/$MAX_WAIT seconds)"
        
        # Check health status
        check_health
        UNHEALTHY=$?
        
        if [ $UNHEALTHY -eq 0 ]; then
          echo "$(date +"$TIMESTAMP_FORMAT") [SUCCESS] All services are healthy. Disabling maintenance mode and restoring normal service..."
          export BACKEND_TRAEFIK_ENABLED=true
          export FRONTEND_TRAEFIK_ENABLED=true
          export MAINTENANCE_TRAEFIK_ENABLED=false
          docker-compose -f docker-compose.prod.registry.yml up -d db redis backend frontend celery-worker celery-beat
          
          echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Services are now healthy. Deployment completed successfully."
          echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Keeping maintenance page active to handle ongoing traffic..."
          docker-compose -f docker-compose.prod.registry.yml up -d maintenance --force-recreate
          exit 0
        else
          # Services are not healthy yet, sleep and try again
          echo "$(date +"$TIMESTAMP_FORMAT") [INFO] Waiting $SLEEP_TIME seconds for the next health check..."
          sleep $SLEEP_TIME
          WAITED=$((WAITED + SLEEP_TIME))
        fi
      done
      
      # If we reach this point, the timeout was reached
      echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Timed out waiting for services to become healthy after $MAX_WAIT seconds."
      ensure_maintenance
      collect_diagnostics
      
      # Show detailed logs for each service
      echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Backend logs ---"
      docker-compose -f docker-compose.prod.registry.yml logs --tail=100 backend
      echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Frontend logs ---"
      docker-compose -f docker-compose.prod.registry.yml logs --tail=50 frontend
      echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Celery worker logs ---"
      docker-compose -f docker-compose.prod.registry.yml logs --tail=50 celery-worker
      echo "$(date +"$TIMESTAMP_FORMAT") [DEBUG] --- Celery beat logs ---"
      docker-compose -f docker-compose.prod.registry.yml logs --tail=50 celery-beat
      
      # Exit with error
      echo "$(date +"$TIMESTAMP_FORMAT") [ERROR] Deployment failed: Services did not become healthy within the timeout period"
      exit 1
  environment:
    name: production
    url: https://aggregator.gfbio.org  # Update with your actual production URL
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  tags:
    - deploy-aggregator
  timeout: 15m
  after_script:
    - |
      echo "$(date +"${TIMESTAMP_FORMAT:-'%Y-%m-%d %H:%M:%S'}") [INFO] Deployment job finished with status: $CI_JOB_STATUS"
