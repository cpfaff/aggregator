---
include:
  - project: gfbio/cicd
    file:
      - '.create_merge_request_v3.yml'
      - '.tag_release.yml'

image: docker:latest

services:
  - name: docker:dind
    alias: docker

stages:
  - create_merge_request
  - tag_release_check
  - tag_release
  - build
  - deploy

variables:
  # DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: docker.gitlab-pe.gwdg.de/gfbio/aggregator
  DOCKER_BUILDKIT: 1
  PROJECT_NAME: "gfbio-aggregator"
  MAIN_BRANCH_NAME: "master"

# Cache during the pipeline
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/

create_merge_request:
  variables:
    PROJECT_NAME: ${PROJECT_NAME}
    APPROVERS: "3832" # Update this with your approver IDs if needed
  tags:
    - dev-denbi

tag_release_check:
  variables:
    MAIN_BRANCH_NAME: ${MAIN_BRANCH_NAME}
  tags:
    - dev-denbi

# Build Backend
build-backend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building backend image..."
    - docker build -t $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/backend:latest -f backend/Dockerfile.prod ./backend
    - docker push $DOCKER_REGISTRY/backend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/backend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Build Frontend
build-frontend:
  stage: build
  before_script:
    - mkdir -p .cache
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Building frontend image..."
    - docker build -t $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA -t $DOCKER_REGISTRY/frontend:latest -f frontend/Dockerfile.prod ./frontend
    - docker push $DOCKER_REGISTRY/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_REGISTRY/frontend:latest
  only:
    - master
    - develop
    - tags
  tags:
    - builder

# Deploy to production
deploy-production:
  stage: deploy
  image: docker/compose:latest
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DOCKER_REGISTRY: $DOCKER_REGISTRY
    ENVIRONMENT: production
    MAINTENANCE_MODE: ${MAINTENANCE_MODE:-"false"}
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD docker.gitlab-pe.gwdg.de
  script:
    - echo "Deploying to production..."
    # Create environment files from CI variables
    
    # Create global .env file
    - echo "# Global environment variables for Docker Compose" > ./.env
    - echo "DB_USER=${DB_USER:-user}" >> ./.env
    - echo "DB_PASSWORD=${DB_PASSWORD:-password}" >> ./.env
    - echo "DB_NAME=${DB_NAME:-dbname}" >> ./.env
    - echo "ENVIRONMENT=${ENVIRONMENT:-production}" >> ./.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./.env
    
    # Create backend .env file
    - mkdir -p ./backend
    - echo "# Backend-specific environment variables" > ./backend/.env
    - echo "SECRET_KEY=${SECRET_KEY:-defaultsecretkey}" >> ./backend/.env
    - echo "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}" >> ./backend/.env
    - echo "LOG_LEVEL=${LOG_LEVEL:-INFO}" >> ./backend/.env
    - echo "ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://aggregator.gfbio.org}" >> ./backend/.env
    
    # Create frontend .env file
    - mkdir -p ./frontend
    - echo "# Frontend-specific environment variables" > ./frontend/.env
    - echo "REACT_APP_API_URL=${REACT_APP_API_URL:-https://aggregator.gfbio.org/api}" >> ./frontend/.env
    
    # Create maintenance directory if it doesn't exist
    - mkdir -p ./maintenance
    
    # Set environment variables for maintenance mode
    - |
      if [ "$MAINTENANCE_MODE" = "true" ]; then
        echo "Enabling maintenance mode..."
        export BACKEND_TRAEFIK_ENABLED=false
        export FRONTEND_TRAEFIK_ENABLED=false
        export MAINTENANCE_TRAEFIK_ENABLED=true
      else
        echo "Maintenance mode is disabled."
        export BACKEND_TRAEFIK_ENABLED=true
        export FRONTEND_TRAEFIK_ENABLED=true
        export MAINTENANCE_TRAEFIK_ENABLED=false
      fi
    
    # Deploy with docker-compose
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - export DOCKER_REGISTRY=docker.gitlab-pe.gwdg.de/gfbio/aggregator
    - docker-compose -f docker-compose.prod.registry.yml config
    - docker-compose -f docker-compose.prod.registry.yml pull
    - docker-compose -f docker-compose.prod.registry.yml down || true
    - docker-compose -f docker-compose.prod.registry.yml up -d

    # Wait for services to be healthy before disabling maintenance mode
    - |
      if [ "$MAINTENANCE_MODE" = "true" ]; then
        echo "Waiting for services to be healthy..."
        # Set maximum wait time (10 minutes)
        MAX_WAIT=600
        WAITED=0
        SLEEP_TIME=10
        
        while [ $WAITED -lt $MAX_WAIT ]; do
          # Check health status of all services (excluding maintenance)
          UNHEALTHY=$(docker-compose -f docker-compose.prod.registry.yml ps | grep -v "maintenance" | grep -v "healthy" | grep -v "^NAME" | wc -l)
          echo $UNHEALTHY
          
          if [ $UNHEALTHY -eq 0 ]; then
            echo "All services are healthy! Beginning controlled transition from maintenance mode..."
            
            # Step 1: Set environment variables but don't restart containers yet
            export BACKEND_TRAEFIK_ENABLED=true
            export FRONTEND_TRAEFIK_ENABLED=true
            # Keep maintenance enabled during transition
            export MAINTENANCE_TRAEFIK_ENABLED=true
            
            # Step 2: Restart backend and frontend specifically to pick up new Traefik settings
            echo "Restarting backend and frontend services with new Traefik settings..."
            docker-compose -f docker-compose.prod.registry.yml up -d backend frontend
            
            # Step 3: Wait for backend and frontend to be fully healthy
            echo "Waiting for backend and frontend to be fully healthy..."
            BACKEND_FRONTEND_WAIT=120
            BF_WAITED=0
            while [ $BF_WAITED -lt $BACKEND_FRONTEND_WAIT ]; do
              UNHEALTHY_BF=$(docker-compose -f docker-compose.prod.registry.yml ps backend frontend | grep -v "healthy" | wc -l)
              if [ $UNHEALTHY_BF -eq 0 ]; then
                echo "Backend and frontend are now healthy!"
                break
              fi
              echo "Waiting for backend and frontend... ($BF_WAITED/$BACKEND_FRONTEND_WAIT seconds)"
              sleep 5
              BF_WAITED=$((BF_WAITED + 5))
            done
            
            # Step 4: Now disable maintenance mode and update container
            echo "Disabling maintenance mode container..."
            export MAINTENANCE_TRAEFIK_ENABLED=false
            docker-compose -f docker-compose.prod.registry.yml up -d maintenance
            
            echo "Transition complete - system is now in normal operation mode"
            break
          fi
          
          echo "Waiting for services to be healthy... ($WAITED/$MAX_WAIT seconds)"
          sleep $SLEEP_TIME
          WAITED=$((WAITED + SLEEP_TIME))
        done
        
        if [ $WAITED -ge $MAX_WAIT ]; then
          echo "WARNING: Timeout reached waiting for services to be healthy. Maintenance mode remains enabled."
          echo "Manual intervention required to disable maintenance mode."
        fi
      fi
  environment:
    name: production
    url: https://aggregator.gfbio.org  # Update with your actual production URL
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  tags:
    - deploy-aggregator
