server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests must NEVER receive the HTML maintenance page.
    #
    # This router is PathPrefix(`/`) at priority 100 (see the compose files), so
    # during a deploy it outranks the backend router and receives /api/* too.
    # Answering those with the SPA-style catch-all below returned 200 + text/html,
    # which passes the frontend's `response.ok` check and makes response.json()
    # throw `Unexpected token '<', "<!DOCTYPE "... is not valid JSON` in every
    # open tab (DASS-3814).
    #
    # A real 503 is both correct HTTP and what the frontend already understands:
    # parseErrorResponse classifies 5xx as class 'server' (transient, retriable,
    # keep stale data) rather than a user-fixable client error.
    #
    # Regex location so it matches /api and /api/... but not /apifoo, and so it
    # is evaluated before the prefix catch-all.
    location ~ ^/api(/|$) {
        add_header Cache-Control "no-store" always;
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service is temporarily unavailable for maintenance."}';
    }

    # Serve index.html for all other requests (SPA-style catch-all).
    #
    # no-store matters: the previous config sent a 200 with a 17-month-old
    # Last-Modified and no cache headers at all, so a browser could hold the
    # maintenance page under heuristic freshness and replay it long after the
    # deploy finished.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # NOTE: there is deliberately no `error_page 503 /index.html;` here.
    # That directive was an internal redirect to the HTML page, and nginx adopts
    # the redirect target's status unless pinned with the `=` form — so it turned
    # every 503 back into 200 + text/html. It is exactly what this fix removes.
}
