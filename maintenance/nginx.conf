server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve index.html for all requests (SPA-style catch-all)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Return 503 Service Unavailable for API requests
    # This is more appropriate for maintenance mode
    error_page 503 /index.html;
}
